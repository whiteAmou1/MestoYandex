<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header__logo">
      <img src="./logos/logo.svg" class="header__logo_svg">

    </div>
  </header>
  <nav >
<div class="nav__bar ">
  <img class="img__circle" src="./images/Jack.jpg">
  <div class="nav__description">
    <div class="nav__title_div"><h4 class="nav__title"><span id="profileName"> Жак-Ив Кусто</span></h4>
    <button class="nav__edit_btn">
      <img class="edit__btn_svg" alt="edit" src="./logos/Edit Button.svg" >
    </button></div>
    <p class="nav__subtitle">
      <span id="profileDescription"> Исследователь океана</span>
      </p>
  </div>
  <div class='nav__add-btn-wrapper'><button class="nav__add-btn" id="nav__add_plus"><span class="add__btn_plus" >+</span></button>
  </div>
  
  
  



<div class="popup" id="popup-edit-profile">
  <div class="popup__container">
    <span id='closePopup'>&times;</span>
    <h2 class="popup__title">Редактировать профиль</h2> 
    <form class="popup__form">
      <label for="name" class="popup__label">Имя</label>
      <input type="text" id="name" class="popup__input" value="Жак-Ив Кусто" placeholder="Имя"
      required maxlength="40" minlength="2">
      <div class="error-message" id="name-error"></div>
      <label for="about" class="popup__label">О себе</label>
      <input type="text" id="description" class="popup__input" value="Исследователь океана"
      required maxlength="200" minlength="2" placeholder="О себе">
      <div class="error-message" id="description-error"></div>
      <button class="popup__button" type="submit" id="saveBtn">  Сохранить </button>
    </form>
  </div>

  </nav>
  <main>

    <div class="popup__add" id="popup-add-card">
      <div class="popup__add_container">
        <span id='popup__add_close'>&times;</span>
        <h2 class="popup__add_title">Новое место</h2> 

        <form class="popup__add_form">
          <div class="popup__add_fields">
            <input  id="cardName" 
            class="popup__add_input" type="text" 
            required placeholder="Название"
            minlength="2" maxlength="30">
            <span class="error-message" id="cardName-error"></span>
            <input type="url" id="cardImage" class="popup__add_input"  
            required placeholder="Ссылка на картинку"
            type="url">
            <span class="error-message" id="cardImage-error"></span>
          </div>
          <button class="popup__add__button"
           type="submit" 
           id="saveBtn">
           Cоздать</button>
        </form>
      </div>
    </div>
    <div class="card__grid">
     
    </div>
</div>
</div>

</div>
  </main>
  <footer>
    <p class="footer__copyright">© 2025 Mesto Russia</p>
  </footer>
</body>
</html>
